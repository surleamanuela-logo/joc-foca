<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foca și peștele</title>
<style>
  :root {
    --s: 72px; --gap: 8px;
    --bleumarin: #16336b;
    --cer1: #9fdcff; --cer2: #e6f7ff;
    --mare1: #4cc3f4; --mare2: #1a8fd4; --mare3: #0f6fb3;
    --roz: #ffe3f1; --roz-margine: #ffb5d8;
    --verde: #36b24a; --verde-umbra: #238a35;
    --portocaliu: #ff9a1f; --portocaliu-umbra: #d4740a;
    --galben: #ffd84d;
    --font: "Arial Rounded MT Bold", "Nunito", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  button, .cub, .celula { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  body { -webkit-user-select: none; user-select: none; }
  select { user-select: auto; }
  body {
    min-height: 100vh; font-family: var(--font); color: var(--bleumarin);
    background: linear-gradient(180deg, var(--cer1) 0%, var(--cer2) 55%, #d3f0ff 100%);
    overflow-x: hidden;
  }

  /* ---------- decor: nori, munți de gheață, fulgi ---------- */
  .decor { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .nor {
    position: absolute; background: #fff; border-radius: 99px; opacity: .85;
    animation: plutire linear infinite;
  }
  .nor::before, .nor::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
  .nor::before { width: 55%; height: 170%; left: 12%; bottom: 20%; }
  .nor::after  { width: 40%; height: 130%; right: 12%; bottom: 25%; }
  @keyframes plutire { from { transform: translateX(-30vw); } to { transform: translateX(130vw); } }
  .fulg {
    position: absolute; top: -20px; color: #fff; text-shadow: 0 0 4px rgba(120,180,230,.8);
    animation: ninge linear infinite;
  }
  @keyframes ninge { to { transform: translateY(110vh) rotate(360deg); } }

  .wrap { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding: 10px 16px 24px; }

  /* ---------- bara logopedului (discretă) ---------- */
  .logoped {
    display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: center;
    background: rgba(255,255,255,.55); backdrop-filter: blur(4px);
    border: 1.5px solid rgba(255,255,255,.9); border-radius: 16px;
    padding: 6px 12px; font-size: 14px; font-family: "Segoe UI", system-ui, sans-serif; color: #3b5580;
  }
  .logoped .eti { font-weight: 700; opacity: .8; }
  .logoped label { display: flex; align-items: center; gap: 5px; }
  .logoped select { font: inherit; padding: 3px 6px; border-radius: 8px; border: 1.5px solid #9ccdee; background: #fff; color: inherit; }
  .logoped button {
    font: inherit; font-weight: 700; border: 1.5px solid #9ccdee; background: #fff; color: #2a6fb0;
    border-radius: 99px; padding: 4px 12px; cursor: pointer;
  }
  .logoped .nota { font-size: 12px; opacity: .75; }

  /* ---------- titlu ---------- */
  .antet { text-align: center; margin: 14px 0 8px; }
  .antet h1 {
    margin: 0; font-size: clamp(42px, 8vw, 74px); line-height: 1; font-weight: 900; letter-spacing: 2px;
    color: #fff;
    text-shadow: 0 3px 0 #2d7fd0, 0 6px 0 #1d5fa8, 0 10px 18px rgba(20,60,120,.35);
    -webkit-text-stroke: 2px #1d5fa8; paint-order: stroke fill;
  }
  .chipuri { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 14px 0 6px; }
  .chip {
    font-weight: 900; font-size: clamp(17px, 2.8vw, 24px); padding: 5px 14px; border-radius: 99px;
    color: var(--bleumarin); box-shadow: 0 3px 0 rgba(0,0,0,.12); border: 2px solid rgba(255,255,255,.9);
  }
  .nivel {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; padding: 5px 16px; border-radius: 99px;
    background: linear-gradient(#ffe57a, #ffc933); color: #6b4a00; font-weight: 900; font-size: clamp(14px, 2.2vw, 18px);
    box-shadow: 0 3px 0 #d9a300;
  }

  /* ---------- zona de joc: balonul cu silaba ---------- */
  .scena { display: flex; flex-wrap: wrap; gap: 14px; align-items: stretch; justify-content: center; margin: 12px 0 14px; }
  .balon {
    position: relative; flex: 1 1 320px; max-width: 520px;
    background: #fff; border-radius: 30px; padding: 14px 18px 16px;
    box-shadow: 0 6px 0 #bfe3fa, 0 12px 26px rgba(30,90,160,.18);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .balon .spune { font-size: 18px; font-weight: 800; color: #5a7bb0; }
  .balon .mare {
    font-size: clamp(64px, 12vw, 104px); font-weight: 900; line-height: 1; letter-spacing: 4px;
    background: linear-gradient(180deg, #2f8fe0, #1d4f9c); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 #d6ecfb);
  }
  .balon .mare img { height: 1.1em; display: block; }
  .balon .pasul { font-size: 18px; font-weight: 800; color: #5a7bb0; margin-top: -4px; }
  .balon .mare.pop { animation: pop .4s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { 0% { transform: scale(.6); } 100% { transform: scale(1); } }
  .rotunde { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .rotund {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: none; border: 0; padding: 0; cursor: pointer; font-family: var(--font);
    color: var(--bleumarin); font-weight: 800; font-size: 15px;
  }
  .rotund .cerc {
    width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center;
    font-size: 36px; color: #fff; transition: transform .12s;
  }
  .rotund:hover .cerc { transform: translateY(-3px) scale(1.04); }
  .rotund:active .cerc { transform: translateY(3px) scale(.97); }
  .rotund.corect .cerc { background: radial-gradient(circle at 35% 30%, #6fdc7e, var(--verde)); box-shadow: 0 6px 0 var(--verde-umbra); }
  .rotund.repeta .cerc { background: radial-gradient(circle at 35% 30%, #ffc266, var(--portocaliu)); box-shadow: 0 6px 0 var(--portocaliu-umbra); }
  .rotund.asculta .cerc { background: radial-gradient(circle at 35% 30%, #8fd3ff, #3a9ee8); box-shadow: 0 6px 0 #2378c0; width: 58px; height: 58px; font-size: 28px; margin-top: 7px; }
  .rotund:disabled { opacity: .4; cursor: default; }

  .instr {
    flex: 1 1 260px; max-width: 420px;
    background: var(--roz); border: 3px dashed var(--roz-margine); border-radius: 28px;
    padding: 14px 18px; font-size: clamp(17px, 2.4vw, 21px); line-height: 1.4; text-align: center;
    display: flex; flex-direction: column; justify-content: center; gap: 4px;
  }
  .instr b { color: #d6337f; }

  /* progres: foca înoată spre pește */
  .progres { position: relative; max-width: 620px; margin: 0 auto 10px; height: 44px; }
  .progres .pista {
    position: absolute; left: 22px; right: 30px; top: 16px; height: 14px; border-radius: 99px;
    background: rgba(255,255,255,.8); box-shadow: inset 0 2px 4px rgba(30,90,160,.2);
  }
  .progres .umplut {
    height: 100%; width: 0; border-radius: 99px; transition: width .4s ease;
    background: linear-gradient(90deg, #7fe08c, #36b24a);
  }
  .progres .mica { position: absolute; top: 0; height: 44px; transition: left .4s ease; }
  .progres .pesteMic { right: 0; left: auto; }
  .mesaj { min-height: 32px; text-align: center; font-size: clamp(18px, 2.8vw, 24px); font-weight: 900; margin-bottom: 6px; }
  .mesaj.bine { color: #1f8a36; } .mesaj.incearca { color: #d06a00; }

  /* ---------- marea cu cuburile ---------- */
  .munti { display: block; width: 100%; max-width: calc(var(--s) * 8 + var(--gap) * 7 + 40px); margin: 0 auto -6px; height: auto; }
  .tabla {
    position: relative; margin: 0 auto; width: max-content;
    padding: 18px 20px; border-radius: 34px;
    background:
      radial-gradient(ellipse 60px 8px at 20% 30%, rgba(255,255,255,.25), transparent 70%),
      radial-gradient(ellipse 80px 9px at 70% 60%, rgba(255,255,255,.2), transparent 70%),
      radial-gradient(ellipse 50px 7px at 40% 85%, rgba(255,255,255,.2), transparent 70%),
      linear-gradient(180deg, var(--mare1), var(--mare2) 55%, var(--mare3));
    box-shadow: 0 0 0 6px #fff, 0 14px 30px rgba(15,80,150,.3), inset 0 0 40px rgba(0,40,90,.25);
  }
  .grila { display: grid; gap: var(--gap); }
  .celula { width: var(--s); height: var(--s); position: relative; }
  .cub {
    display: flex; align-items: center; justify-content: center; user-select: none;
    border-radius: 18px; font-weight: 900; font-size: calc(var(--s) * .38); color: var(--bleumarin);
    background: linear-gradient(160deg, #ffffff 0%, #eaf8ff 45%, #b5e3fa 100%);
    box-shadow: inset 0 -7px 0 rgba(110,180,225,.55), inset 0 3px 0 #fff, 0 6px 0 #5aa8d8, 0 10px 12px rgba(0,30,70,.3);
  }
  .cub::before {  /* luciul gheții */
    content: ""; position: absolute; left: 12%; top: 10%; width: 30%; height: 14%;
    border-radius: 99px; background: rgba(255,255,255,.9); transform: rotate(-12deg);
  }
  .cub.vizitat {
    background: linear-gradient(160deg, #f5fff3, #cff5ca 50%, #93dc8c);
    box-shadow: inset 0 -7px 0 rgba(60,150,60,.4), inset 0 3px 0 #fff, 0 6px 0 #4a9d49, 0 10px 12px rgba(0,30,70,.28);
  }
  .cub.vizitat::after {
    content: "⭐"; position: absolute; right: -6px; top: -8px; font-size: calc(var(--s) * .3);
    animation: stea .5s cubic-bezier(.3,1.8,.5,1);
  }
  @keyframes stea { from { transform: scale(0) rotate(-90deg); } }
  .cub.urmator { cursor: pointer; z-index: 2; animation: straluceste 1.2s ease-in-out infinite; }
  @keyframes straluceste {
    50% { transform: scale(1.1); box-shadow: 0 0 0 5px var(--galben), 0 0 26px 8px rgba(255,216,77,.9), 0 6px 0 #5aa8d8; }
  }
  .cub.repeta { animation: clatina .5s ease; }
  @keyframes clatina { 25%{transform:rotate(-7deg)} 50%{transform:rotate(7deg)} 75%{transform:rotate(-3deg)} }

  .apa.sloi::after {
    content: ""; position: absolute; left: 20%; top: 40%; width: 60%; height: 28%;
    border-radius: 50% 50% 40% 40%; background: linear-gradient(#fff, #d4f0ff); box-shadow: 0 4px 0 #7fbfe3;
    animation: leagan 3s ease-in-out infinite;
  }
  .apa.val::after {
    content: "〰"; position: absolute; inset: 0; display: grid; place-items: center;
    color: rgba(255,255,255,.35); font-size: calc(var(--s) * .45);
  }
  @keyframes leagan { 50% { transform: translateY(-3px) rotate(2deg); } }
  .mal {
    border-radius: 50% 50% 34% 34%;
    background: linear-gradient(#ffffff, #e0f4ff 60%, #aedcf5);
    box-shadow: inset 0 -6px 0 rgba(110,180,225,.5), 0 6px 0 #6fb4dc, 0 10px 12px rgba(0,30,70,.3);
  }
  .peste { display: flex; align-items: center; justify-content: center; }
  .peste img { width: 115%; margin-top: -40%; animation: sarePeste 1.6s ease-in-out infinite; filter: drop-shadow(0 4px 3px rgba(0,0,0,.25)); }
  @keyframes sarePeste { 50% { transform: translateY(-8px) rotate(-8deg); } }

  .foca {
    position: absolute; width: var(--s); height: var(--s);
    transition: left .4s ease, top .4s ease; z-index: 5;
    cursor: grab; touch-action: none;
  }
  .foca.trage { transition: none; z-index: 10; cursor: grabbing; }
  .foca.trage span { transform: scale(1.15); filter: drop-shadow(0 14px 10px rgba(0,0,0,.35)); }
  .foca.asteapta:not(.trage) span { animation: invita 1.4s ease-in-out infinite; }
  @keyframes invita { 0%, 70%, 100% { transform: none; } 80% { transform: rotate(-6deg) translateY(-6%); } 90% { transform: rotate(5deg); } }
  /* degetul care arată copilului cum se trage foca */
  .deget {
    position: absolute; z-index: 12; pointer-events: none; font-size: calc(var(--s) * .6);
    filter: drop-shadow(0 3px 3px rgba(0,0,0,.3)); display: none;
  }
  .deget.arata { display: block; animation: arataDeget 2s ease-in-out infinite; }
  @keyframes arataDeget {
    0% { transform: translate(var(--x0), var(--y0)); opacity: 0; }
    15% { opacity: 1; transform: translate(var(--x0), var(--y0)) scale(.9); }
    70% { transform: translate(var(--x1), var(--y1)); opacity: 1; }
    100% { transform: translate(var(--x1), var(--y1)); opacity: 0; }
  }
  .peste.tinta { animation: straluceste 1.2s ease-in-out infinite; border-radius: 50%; }
  .foca span {
    position: absolute; left: -22%; bottom: 18%; width: 144%;
    transform-origin: 50% 100%; filter: drop-shadow(0 5px 4px rgba(0,0,0,.3));
  }
  .foca img { width: 100%; display: block; }
  .foca.sare span { animation: salt .4s ease; }
  @keyframes salt { 50% { transform: translateY(-45%) scale(1.05); } }
  .peste.mancat img { animation: inghitit .7s ease forwards; }
  @keyframes inghitit { to { transform: translateX(-40%) scale(0) rotate(-40deg); opacity: 0; } }
  .foca.mestec span { animation: mestec .18s ease-in-out 4; }
  @keyframes mestec { 50% { transform: scale(1.12, .9); } }
  .foca.fericita span { animation: bucurie .5s ease-in-out 3; }
  @keyframes bucurie { 50% { transform: translateY(-35%) rotate(10deg); } }

  .scurtaturi { text-align: center; font-size: 12px; color: #5b7aa6; margin-top: 16px; font-family: "Segoe UI", system-ui, sans-serif; }

  /* ---------- final ---------- */
  .final {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(20,60,120,.4); backdrop-filter: blur(3px); z-index: 20; padding: 16px;
  }
  .final.arata { display: flex; }
  .final .carte {
    position: relative; background: #fff; border-radius: 34px; padding: 70px 28px 24px; text-align: center; max-width: 470px;
    box-shadow: 0 8px 0 #bfe3fa, 0 20px 50px rgba(0,0,0,.3); animation: apare .5s cubic-bezier(.3,1.5,.5,1);
  }
  .final .focaFinal { position: absolute; left: 50%; top: -70px; width: 150px; transform: translateX(-50%); animation: bucurieFinal 1s ease-in-out infinite; }
  @keyframes bucurieFinal { 50% { transform: translateX(-50%) translateY(-10px) rotate(-4deg); } }
  .final h2 { margin: 0 0 4px; font-size: 40px; color: #2d7fd0; }
  .final .stele { font-size: 50px; letter-spacing: 8px; margin: 2px 0 6px; }
  .final .stele span { display: inline-block; animation: stea .6s cubic-bezier(.3,1.8,.5,1) both; }
  .final p { font-size: 18px; margin: 6px 0 18px; line-height: 1.5; }
  .final .butoane { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .final button {
    font-family: var(--font); font-size: 18px; font-weight: 900; border: 0; border-radius: 99px; padding: 12px 22px; cursor: pointer;
  }
  .final .principal { background: linear-gradient(#5fd06e, var(--verde)); color: #fff; box-shadow: 0 5px 0 var(--verde-umbra); }
  .final .secundar { background: #eaf6ff; color: #2a6fb0; box-shadow: 0 5px 0 #bcdcf3; }
  .final button:active { transform: translateY(4px); box-shadow: none; }
  @keyframes apare { from { transform: scale(.6); opacity: 0; } }
  .confetti { position: fixed; top: -20px; width: 10px; height: 16px; z-index: 30; pointer-events: none; animation: cade linear forwards; }
  @keyframes cade { to { transform: translateY(110vh) rotate(720deg); } }

  /* ecrane late (laptop, tablă interactivă, tabletă pe orizontală): balonul în stânga, marea în dreapta */
  @media (min-width: 960px) and (orientation: landscape) {
    .antet { margin: 8px 0 4px; }
    .antet h1 { font-size: clamp(40px, 5vw, 64px); }
    .chipuri { margin: 8px 0 4px; }
    .joc { display: grid; grid-template-columns: minmax(300px, 360px) 1fr; gap: 22px; align-items: start; margin-top: 8px; }
    .scena { flex-direction: column; margin: 0; }
    .scena .balon, .scena .instr { flex: none; max-width: none; }
    .scena .balon { order: -1; }
    .instr { font-size: 17px; padding: 10px 14px; }
  }
  @media (max-width: 560px) {
    .rotund .cerc { width: 60px; height: 60px; font-size: 30px; }
    .rotund.asculta .cerc { width: 50px; height: 50px; font-size: 24px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .nor, .fulg, .apa.sloi::after, .peste img { animation: none; }
  }
</style>
</head>
<body>
<div class="decor" id="decor"></div>

<div class="wrap">
  <div class="logoped">
    <span class="eti">Pentru logoped:</span>
    <label>Sunetul <select id="selSunet"></select></label>
    <label>Nivel
      <select id="selNivel">
        <option value="1">1 · Silabe directe (FA)</option>
        <option value="2">2 · Silabe inverse (AF)</option>
      </select>
    </label>
    <button id="btnNou">🔄 Joc nou</button>
    <button id="btnEcran">⛶ Ecran complet</button>
  </div>

  <div class="antet">
    <h1 id="titlu">Sunetul F</h1>
    <div class="chipuri" id="chipuri"></div>
    <div class="nivel" id="eticNivel"></div>
  </div>

  <div class="joc">
  <div class="scena">
    <div class="instr" id="instr"></div>
    <div class="balon">
      <div class="spune">Spune:</div>
      <div class="mare" id="silabaMare">FA</div>
      <div class="pasul" id="pasul">apoi trage foca pe cub 👆</div>
      <div class="rotunde">
        <button class="rotund repeta" id="btnRepeta"><span class="cerc">↻</span>Mai încearcă</button>
      </div>
    </div>
  </div>

  <div class="dreapta" id="dreapta">

const VOCALE = ['A','E','I','O','U','Ă','Â'];
const CULORI_CHIP = ['#ffd1d6','#fff0a8','#c9f5d2','#e3d6ff','#cdeeff','#ffdcc2','#ffd3ef'];
// pe ecran îngust (telefon) tabla stă pe verticală: mai multe rânduri, mai puține coloane, cuburi mai mari
let RANDURI = 4, COLOANE = 6;
const DIR = [[0,1],[1,0],[0,-1],[-1,0]];

const $ = id => document.getElementById(id);
const cheie = (r, c) => r + ',' + c;
const amesteca = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const alege = a => a[Math.floor(Math.random() * a.length)];

// nivelul 1: consoană + vocală (FA); nivelul 2: vocală + consoană (AF)
function silabe(sunet, nivel) {
  return VOCALE.map(v => nivel === 2 ? v + sunet : sunet + v);
}

let drum, pas, repetari, repetariPeSilaba, cuburiCuRepetari, terminat;

// ---------- decor ----------
(function decor() {

  [[8, 70, 60], [22, 110, 85], [5, 90, 110], [30, 60, 70]].forEach(([top, lat, durata], i) => {

    d.appendChild(n);

  for (let i = 0; i < 22; i++) {
    const f = document.createElement('div');
    f.className = 'fulg'; f.textContent = '❄';

    d.appendChild(f);
  }
})();

['F','V','S','Ș','Z','J','Ț','R','L','P','B','T','D','M','N','H'].forEach(s => $('selSunet').add(new Option(s, s)));
$('selSunet').value = 'F';
$('selSunet').onchange = jocNou;

// ---------- foca se trage cu degetul (sau cu mouse-ul) ----------
let tragere = null, aMutatOData = false;
$('foca').addEventListener('pointerdown', e => {
  if (terminat) return;
  e.preventDefault();
  const f = $('foca');
  // o atingere nouă preia mereu foca, chiar dacă una veche n-a primit „ridicarea degetului”
  // (deget ridicat în afara ecranului, două degete, notificare peste joc)
  try { f.setPointerCapture(e.pointerId); } catch (err) {}
  // dacă foca e încă în mijlocul unei sărituri, o terminăm pe loc: foca e apucată de pe cubul ei,
  // indiferent cât de repede desenează tableta/tabla animațiile
  f.getAnimations().forEach(a => { try { a.finish(); } catch (err) {} });
  const rf = f.getBoundingClientRect();
  tragere = { id: e.pointerId, dx: e.clientX - rf.left, dy: e.clientY - rf.top, lat: rf.width, x0: rf.left, y0: rf.top };
  f.classList.add('trage');
  mutaLaDeget(e);
  $('deget').classList.remove('arata');
});
function mutaLaDeget(e) {
  const f = $('foca'), rt = $('tabla').getBoundingClientRect();
  f.style.left = (e.clientX - tragere.dx - rt.left) + 'px';
  f.style.top = (e.clientY - tragere.dy - rt.top) + 'px';
}
window.addEventListener('pointermove', e => {
  if (!tragere || e.pointerId !== tragere.id) return;
  mutaLaDeget(e);
});
function lasaFoca(e) {
  if (!tragere || e.pointerId !== tragere.id) return;
  const t = tragere;
  tragere = null;
  const f = $('foca');
  f.classList.remove('trage');
  // unde a ajuns centrul focii? îl calculăm din poziția degetului, nu măsurând foca pe ecran
  // (măsurătoarea poate fi încurcată de o animație încă în curs)
  const stanga = e.clientX - t.dx, sus = e.clientY - t.dy;
  const cx = stanga + t.lat / 2, cy = sus + t.lat / 2;
  const tinta = pas < drum.length ? $('cub' + pas) : $('peste');
  const rt = tinta.getBoundingClientRect(), marja = rt.width * 0.35;
  const aNimerit = cx > rt.left - marja && cx < rt.right + marja && cy > rt.top - marja && cy < rt.bottom + marja;
  if (aNimerit) { aMutatOData = true; pas < drum.length ? corect() : castig(); return; }
  // lăsată în altă parte: foca se întoarce la locul ei
  const departe = Math.hypot(stanga - t.x0, sus - t.y0) > t.lat * 0.3;
  mutaFoca(pozitieFoca, false);
  if (departe) seteazaMesaj(pas < drum.length ? 'Foca sare doar pe cubul care strălucește ✨' : 'Du foca la pește! 🐟', 'incearca');
  arataDeget();
}
// ridicarea degetului e prinsă oriunde pe pagină, nu doar deasupra focii
window.addEventListener('pointerup', lasaFoca);
window.addEventListener('pointercancel', lasaFoca);

// la început (până la prima mutare) un deget arată cum se trage foca
function arataDeget() {
  const d = $('deget');
  d.classList.remove('arata');
  if (aMutatOData || terminat) return;
  const f = $('foca'), t = $('cub' + pas);
  const s = f.offsetWidth;
  d.style.left = '0px'; d.style.top = '0px';
  d.style.setProperty('--x0', (f.offsetLeft + s * .35) + 'px');
  d.style.setProperty('--y0', (f.offsetTop + s * .45) + 'px');
  d.style.setProperty('--x1', (t.offsetLeft + s * .35) + 'px');
  d.style.setProperty('--y1', (t.offsetTop + s * .45) + 'px');
  void d.offsetWidth; d.classList.add('arata');
}

// ---------- efecte sonore ----------
let audio = null;
function ton(frecvente, tip, durata) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    frecvente.forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain(), t0 = audio.currentTime + i * durata;
      o.type = tip; o.frequency.value = f;
      g.gain.setValueAtTime(0.15, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + durata);
      o.connect(g).connect(audio.destination); o.start(t0); o.stop(t0 + durata);
    });
  } catch (e) {}
}

// ---------- drum aleator care nu se atinge singur ----------
function genereazaDrum(R, C) {
  let buget;
  const liber = (r, c, pr, pc, set) => {
    if (r < 0 || c < 0 || r >= R || c >= C || set.has(cheie(r, c))) return false;
    for (const [dr, dc] of DIR) {
      const nr = r + dr, nc = c + dc;
      if (nr === pr && nc === pc) continue;
      if (set.has(cheie(nr, nc))) return false;
    }
    return true;
  };
  function cauta(d, set, minim) {
    if (--buget < 0) return false;
    const [r, c] = d[d.length - 1];
    if (r === R - 1 && c === C - 1) return d.length >= minim;
    for (const [dr, dc] of amesteca(DIR.slice())) {
      const nr = r + dr, nc = c + dc;
      if (!liber(nr, nc, r, c, set)) continue;
      d.push([nr, nc]); set.add(cheie(nr, nc));
      if (cauta(d, set, minim)) return true;
      d.pop(); set.delete(cheie(nr, nc));
    }
    return false;
  }
  for (let minim = Math.round(R * C * 0.5); minim > 0; minim -= 1) {
    for (let t = 0; t < 30; t++) {
      buget = 20000;
      const d = [[0, 0]], set = new Set([cheie(0, 0)]);
      if (cauta(d, set, minim)) return d;
    }
  }
}

// ---------- joc ----------
function jocNou() {
  const sunet = $('selSunet').value, nivel = +$('selNivel').value;
  const lista = silabe(sunet, nivel);
  [RANDURI, COLOANE] = document.documentElement.clientWidth < 600 ? [6, 4] : [4, 6];

  $('titlu').textContent = 'Sunetul ' + sunet;
  $('chipuri').innerHTML = lista.map((s, i) => `<span class="chip" style="background:${CULORI_CHIP[i]}">${s}</span>`).join('');
  $('eticNivel').textContent = nivel === 2 ? '⭐ Nivelul 2 · Silabe inverse' : '⭐ Nivelul 1 · Silabe directe';
  $('instr').innerHTML = '<div>Ajută <b>foca</b> să ajungă la <b>pește</b>! 🐟</div>' +
    '<div>Spune silaba de pe cubul care <b>strălucește</b>.</div><div>Apoi <b>trage foca cu degetul</b> pe cub! 👆</div>';

  // silabele se repetă prin toate cele 7, amestecate, fără aceeași silabă de două ori la rând
  let rezerva = [], ultima = null;
  drum = genereazaDrum(RANDURI, COLOANE).map(([r, c]) => {
    if (!rezerva.length) { rezerva = amesteca(lista.slice()); if (rezerva[rezerva.length - 1] === ultima) rezerva.unshift(rezerva.pop()); }
    ultima = rezerva.pop();
    return { r, c, silaba: ultima };
  });

  pas = 0; repetari = 0; repetariPeSilaba = {}; cuburiCuRepetari = new Set(); terminat = false;
  aMutatOData = false; tragere = null;
  $('foca').classList.remove('fericita', 'mestec', 'trage');
  deseneaza();
  actualizeaza();
  seteazaMesaj('', '');
  setTimeout(arataDeget, 600);
}

function deseneaza() {
  const g = $('grila');
  g.innerHTML = '';
  potrivesteMarimea();
  g.style.gridTemplateColumns = `repeat(${COLOANE + 2}, var(--s))`;
  const peDrum = {};
  drum.forEach((p, i) => peDrum[cheie(p.r, p.c)] = i);
  for (let r = 0; r < RANDURI; r++) for (let c = -1; c <= COLOANE; c++) {
    const el = document.createElement('div');
    el.className = 'celula';
    el.dataset.k = cheie(r, c);
    const i = peDrum[cheie(r, c)];
    if (c === -1 && r === 0) el.classList.add('mal');
    else if (c === COLOANE && r === RANDURI - 1) { el.classList.add('mal', 'peste'); el.innerHTML = '<img alt="pește" src="' + IMG_PESTE + '">'; el.id = 'peste'; }
    else if (i !== undefined) {
      el.classList.add('cub'); el.textContent = drum[i].silaba; el.id = 'cub' + i;
    }
    else { el.classList.add('apa'); const x = Math.random(); if (x < 0.35) el.classList.add('sloi'); else if (x < 0.6) el.classList.add('val'); }
    g.appendChild(el);
  }
  mutaFoca([0, -1], false);
}

function potrivesteMarimea() {
  const coloane = COLOANE + 2;
  const lat = matchMedia('(min-width: 960px) and (orientation: landscape)').matches;
  const latime = (lat ? $('dreapta').clientWidth : Math.min(document.documentElement.clientWidth, 1280) - 32) - 40;
  const gap = latime < 500 ? 5 : 9;
  let s = Math.floor((latime - gap * (coloane - 1)) / coloane);
  if (lat) {
    // tabla trebuie să încapă pe ecran fără derulare
    const sus = $('dreapta').getBoundingClientRect().top + window.scrollY;
    const deasupraTablei = $('tabla').getBoundingClientRect().top - $('dreapta').getBoundingClientRect().top;
    const inaltime = window.innerHeight - sus - deasupraTablei - 36 - 24;
    s = Math.min(s, Math.floor((inaltime - gap * (RANDURI - 1)) / RANDURI));
  }
  s = Math.max(26, Math.min(120, s));
  document.documentElement.style.setProperty('--s', s + 'px');
  document.documentElement.style.setProperty('--gap', gap + 'px');
}
let pozitieFoca = [0, -1];
window.addEventListener('resize', () => { if (drum) { potrivesteMarimea(); mutaFoca(pozitieFoca, false); } });

function mutaFoca(poz, cuSalt) {
  pozitieFoca = poz;
  const el = document.querySelector(`[data-k="${cheie(poz[0], poz[1])}"]`);
  const f = $('foca');
  f.style.left = el.offsetLeft + 'px';
  f.style.top = el.offsetTop + 'px';
  if (cuSalt) { f.classList.remove('sare'); void f.offsetWidth; f.classList.add('sare'); }
}

function actualizeaza() {
  document.querySelectorAll('.cub.urmator').forEach(e => e.classList.remove('urmator'));
  const laPeste = pas === drum.length;
  if (!terminat && !laPeste) $('cub' + pas).classList.add('urmator');
  $('peste').classList.toggle('tinta', laPeste && !terminat);
  $('foca').classList.toggle('asteapta', !terminat);
  // emoji-urile ar lua culoarea gradientului literelor (pată albastră), așa că folosim imaginile
  if (terminat || laPeste) $('silabaMare').innerHTML = `<img alt="" src="${terminat ? $('foca').querySelector('img').src : IMG_PESTE}">`;
  else $('silabaMare').textContent = drum[pas].silaba;
  $('pasul').textContent = terminat ? 'Ham!' : laPeste ? 'Du foca la pește! 👆' : 'apoi trage foca pe cub 👆';
  $('btnRepeta').disabled = terminat || laPeste;
  const procent = pas / drum.length;
  $('umplut').style.width = (procent * 100) + '%';
  $('focaMica').style.left = `calc(${procent} * (100% - 74px))`;
}

function pop() {
  const m = $('silabaMare');
  m.classList.remove('pop'); void m.offsetWidth; m.classList.add('pop');
}

function seteazaMesaj(text, tip) {
  const m = $('mesaj');
  m.textContent = text; m.className = 'mesaj ' + tip;
}

function corect() {
  if (terminat) return;
  const p = drum[pas];
  $('cub' + pas).classList.add('vizitat');
  mutaFoca([p.r, p.c], true);
  ton([520, 780], 'sine', 0.12);
  seteazaMesaj(alege(['Bravo!', 'Foarte bine!', 'Super!', 'Așa da!', 'Minunat!']) + ' ' + p.silaba + ' ⭐', 'bine');
  pas++;
  actualizeaza();
  pop();
  if (pas === drum.length) seteazaMesaj('Bravo! Acum du foca la pește! 🐟', 'bine');
}

function maiIncearca() {
  if (terminat || pas === drum.length) return;
  const s = drum[pas].silaba;
  repetari++;
  repetariPeSilaba[s] = (repetariPeSilaba[s] || 0) + 1;
  cuburiCuRepetari.add(pas);
  const el = $('cub' + pas);
  el.classList.remove('repeta'); void el.offsetWidth; el.classList.add('repeta');
  ton([330], 'sine', 0.18);
  seteazaMesaj(alege(['Hai încă o dată:', 'Mai încearcă:', 'Aproape! Încă o dată:']) + ' ' + s, 'incearca');
  actualizeaza();
  pop();
}

function confetti() {
  const culori = ['#ff6b8a', '#ffd84d', '#5fd06e', '#4cb8ff', '#b98cff', '#ff9a1f'];
  for (let i = 0; i < 90; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.cssText = `left:${Math.random() * 100}vw;background:${alege(culori)};animation-duration:${2.2 + Math.random() * 2}s;animation-delay:${Math.random() * .8}s;border-radius:${Math.random() < .5 ? '50%' : '3px'}`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5200);
  }
}

function castig() {
  terminat = true;
  actualizeaza();
  // copilul a dus foca la pește: se așază pe sloi și îl mănâncă
  mutaFoca([RANDURI - 1, COLOANE], false);
  setTimeout(() => {
    seteazaMesaj('Ham! Foca a mâncat peștele! 😋', 'bine');
    setTimeout(() => {
      $('peste').classList.add('mancat');
      $('foca').classList.add('mestec');
      ton([300, 240, 300, 240], 'triangle', 0.09);
    }, 380);
    setTimeout(() => {
      $('peste').innerHTML = '';
      $('foca').classList.remove('mestec');
      $('foca').classList.add('fericita');
      ton([523, 659, 784, 1047], 'sine', 0.16);
    }, 1100);

    const total = drum.length;
    const cuRepetari = Object.keys(repetariPeSilaba);
    const dinPrima = total - cuburiCuRepetari.size;
    const raport = dinPrima / total;
    const stele = raport >= 0.9 ? 3 : raport >= 0.6 ? 2 : 1;
    $('stele').innerHTML = [0, 1, 2].map(i => `<span style="animation-delay:${.2 + i * .2}s">${i < stele ? '⭐' : '☆'}</span>`).join('');
    let text = `Foca a ajuns la pește și l-a mâncat! 🐟<br>Corect din prima: <b>${dinPrima} din ${total}</b> silabe`;
    if (cuRepetari.length)
      text += '<br>Au avut nevoie de repetări: ' + cuRepetari.map(s => `<b>${s}</b> (${repetariPeSilaba[s]}×)`).join(', ');
    $('textFinal').innerHTML = text;
    const nivel = +$('selNivel').value;
    $('btnNivel2').style.display = nivel === 1 ? '' : 'none';
    $('btnNivel1').style.display = nivel === 2 ? '' : 'none';
    $('btnDinNou').className = nivel === 2 ? 'principal' : 'secundar';
    setTimeout(() => { $('final').classList.add('arata'); confetti(); }, 2000);
  }, 50);
}

jocNou();
</script>
</body>
</html>
